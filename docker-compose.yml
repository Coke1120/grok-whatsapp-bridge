# WhatsApp bridge. The HTTP API is not authenticated.
# Publish on the host loopback only. Never map this port to 0.0.0.0,
# a LAN address, a router forward, or Tailscale Funnel.
# See docs/docker-synology.md.

name: grok-whatsapp-bridge

services:
  bridge:
    image: grok-whatsapp-bridge:local
    build: .
    env_file: .env
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    environment:
      # Wildcard inside the container so the published loopback port can connect.
      # Host-header checks still allow loopback names, plus the Compose DNS name below.
      WHATSAPP_BIND_HOST: "0.0.0.0"
      WHATSAPP_TRUSTED_HOSTS: bridge
      WHATSAPP_SESSION_DIR: /app/session
      HOME: /home/node
    ports:
      # Host loopback only. Do not change this to "37100:37100" or "0.0.0.0:37100:37100".
      - "127.0.0.1:${WHATSAPP_BRIDGE_PORT:-37100}:${WHATSAPP_BRIDGE_PORT:-37100}"
    volumes:
      # Single account and the default/primary account (./session).
      - wa-session:/app/session
      # Other accounts (./sessions/<name>, for example ./sessions/sales).
      - wa-sessions:/app/sessions
      - ./accounts:/app/accounts:ro
      # Uncomment on bridge AND listener when WHATSAPP_ACCOUNTS=./accounts.json:
      # - ./accounts.json:/app/accounts.json:ro
    healthcheck:
      # HTTP is up. This stays green while WhatsApp is connecting or showing a QR.
      test: ["CMD", "node", "-e", "const p=process.env.WHATSAPP_BRIDGE_PORT||'37100';fetch('http://127.0.0.1:'+p+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  listener:
    profiles: ["listener"]
    image: grok-whatsapp-bridge:local
    build: .
    env_file: .env
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      bridge:
        condition: service_healthy
    command: ["listener"]
    environment:
      HOME: /home/node
      # Compose DNS name. Survives a bridge recreate; 127.0.0.1 would be this container.
      WHATSAPP_BRIDGE_URL: http://bridge:${WHATSAPP_BRIDGE_PORT:-37100}
      WHATSAPP_INBOX_PATH: /app/listener-data/inbox.jsonl
      WHATSAPP_LISTENER_STATE_PATH: /app/listener-data/listener-state.json
      WHATSAPP_UNREAD_FLAG_PATH: /app/listener-data/unread.flag
    volumes:
      - wa-listener:/app/listener-data
      - ./accounts:/app/accounts:ro
      # - ./accounts.json:/app/accounts.json:ro
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot QR. Not started by `docker compose up`.
  # docker compose run --rm -e WHATSAPP_PAIR_CONFIRM=1 pair <account>
  pair:
    profiles: ["pair"]
    image: grok-whatsapp-bridge:local
    build: .
    env_file: .env
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    network_mode: "service:bridge"
    depends_on:
      bridge:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["pair"]
    environment:
      WHATSAPP_DOCKER_ROLE: pair
      WHATSAPP_SESSION_DIR: /app/session
      HOME: /home/node
    volumes:
      - wa-session:/app/session
      - wa-sessions:/app/sessions
      - ./accounts:/app/accounts:ro
      # - ./accounts.json:/app/accounts.json:ro
    healthcheck:
      disable: true

volumes:
  wa-session:
  wa-sessions:
  wa-listener:

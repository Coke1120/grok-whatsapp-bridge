# Grok WhatsApp Bridge. The HTTP API is not authenticated.
# Pull ghcr.io/coke1120/grok-whatsapp-bridge:<tag>. Do not build this file on a NAS.
# Synology Container Manager and Portainer must not pass --build. On-box npm ci
# hangs there. Dev hosts that need a local image use docker-compose.build.yml.
#
# Publish on the host loopback only. Never map this port to 0.0.0.0, a LAN
# address, a router forward, or Tailscale Funnel.
# When Compose bridge DNS/egress is dead, use docker-compose.host-net.yml.
# That overlay is not the default. See docs/docker-synology.md.

name: grok-whatsapp-bridge

x-app-env: &app-env
  # Project `.env` (Compose interpolation) or the Portainer stack environment.
  # There is no relative env_file: Portainer resolves that from an internal
  # directory and drops or ignores secrets. Do not commit real values.
  # Docker-only values below stay fixed so a bare-metal .env cannot point the
  # container at a host path or at 127.0.0.1 inside bridge networking.
  WHATSAPP_BRIDGE_PORT: ${WHATSAPP_BRIDGE_PORT:-37100}
  WHATSAPP_BIND_HOST: "0.0.0.0"
  # Default `bridge` is the Compose DNS name. Set WHATSAPP_TRUSTED_HOSTS in
  # `.env` or Portainer to extend it (Tailscale Serve MagicDNS). A public name
  # does not belong here. Primary Serve is the Mac mini. Older NAS example
  # was leohofamily.tail48056.ts.net. Example:
  # WHATSAPP_TRUSTED_HOSTS=bridge,leos-mac-mini.tail48056.ts.net
  WHATSAPP_TRUSTED_HOSTS: ${WHATSAPP_TRUSTED_HOSTS:-bridge}
  WHATSAPP_SESSION_DIR: /app/session
  HOME: /home/node
  WHATSAPP_ALLOWED_USERS: ${WHATSAPP_ALLOWED_USERS:-}
  WHATSAPP_GROUP_ALLOWED_USERS: ${WHATSAPP_GROUP_ALLOWED_USERS:-}
  WHATSAPP_MODE: ${WHATSAPP_MODE:-bot}
  WHATSAPP_DM_POLICY: ${WHATSAPP_DM_POLICY:-}
  WHATSAPP_GROUP_POLICY: ${WHATSAPP_GROUP_POLICY:-}
  # Unset keeps the built-in Grok WhatsApp Bridge prefix. An empty value in
  # `.env` (the example file) turns the prefix off, same as bare metal.
  WHATSAPP_REPLY_PREFIX: "${WHATSAPP_REPLY_PREFIX-☤ *Grok WhatsApp Bridge*\\n────────────\\n}"
  WHATSAPP_FORWARD_OWNER_MESSAGES: ${WHATSAPP_FORWARD_OWNER_MESSAGES:-}
  WHATSAPP_SEND_READ_RECEIPTS: ${WHATSAPP_SEND_READ_RECEIPTS:-}
  WHATSAPP_PROGRAMMATIC_ACK: ${WHATSAPP_PROGRAMMATIC_ACK:-}
  WHATSAPP_WAKE_WEBHOOK_URL: ${WHATSAPP_WAKE_WEBHOOK_URL:-}
  WHATSAPP_WAKE_WEBHOOK_AUTH: ${WHATSAPP_WAKE_WEBHOOK_AUTH:-}
  WHATSAPP_WAKE_AUTHORIZATION: ${WHATSAPP_WAKE_AUTHORIZATION:-}
  WHATSAPP_POLL_MS: ${WHATSAPP_POLL_MS:-}
  WHATSAPP_RECONNECT_BASE_MS: ${WHATSAPP_RECONNECT_BASE_MS:-}
  WHATSAPP_RECONNECT_CAP_MS: ${WHATSAPP_RECONNECT_CAP_MS:-}
  WHATSAPP_MAX_MESSAGE_LENGTH: ${WHATSAPP_MAX_MESSAGE_LENGTH:-}
  WHATSAPP_CHUNK_DELAY_MS: ${WHATSAPP_CHUNK_DELAY_MS:-}
  WHATSAPP_SEND_TIMEOUT_MS: ${WHATSAPP_SEND_TIMEOUT_MS:-}
  WHATSAPP_DEBUG: ${WHATSAPP_DEBUG:-}
  WHATSAPP_ACCOUNTS: ${WHATSAPP_ACCOUNTS:-}
  WHATSAPP_ACCOUNTS_DIR: ${WHATSAPP_ACCOUNTS_DIR:-/app/accounts}
  WHATSAPP_DEFAULT_ACCOUNT: ${WHATSAPP_DEFAULT_ACCOUNT:-}

services:
  bridge:
    image: &bridge-image ghcr.io/coke1120/grok-whatsapp-bridge:v1.3.3
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *app-env
    ports:
      # Host loopback only. Do not change this to "37100:37100" or "0.0.0.0:37100:37100".
      - "127.0.0.1:${WHATSAPP_BRIDGE_PORT:-37100}:${WHATSAPP_BRIDGE_PORT:-37100}"
    volumes:
      # Single account and the default/primary account (./session).
      - wa-session:/app/session
      # Other accounts (./sessions/<name>, for example ./sessions/sales).
      - wa-sessions:/app/sessions
      - ./accounts:/app/accounts:ro
      # Uncomment on bridge AND listener when WHATSAPP_ACCOUNTS=./accounts.json:
      # - ./accounts.json:/app/accounts.json:ro
    healthcheck:
      # HTTP is up. This stays green while WhatsApp is connecting or showing a QR.
      test: ["CMD", "node", "-e", "const p=process.env.WHATSAPP_BRIDGE_PORT||'37100';fetch('http://127.0.0.1:'+p+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  listener:
    profiles: ["listener"]
    image: *bridge-image
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      bridge:
        condition: service_healthy
    command: ["listener"]
    environment:
      <<: *app-env
      # Compose DNS name. Survives a bridge recreate; 127.0.0.1 would be this container.
      WHATSAPP_BRIDGE_URL: http://bridge:${WHATSAPP_BRIDGE_PORT:-37100}
      WHATSAPP_INBOX_PATH: /app/listener-data/inbox.jsonl
      WHATSAPP_LISTENER_STATE_PATH: /app/listener-data/listener-state.json
      WHATSAPP_UNREAD_FLAG_PATH: /app/listener-data/unread.flag
    volumes:
      - wa-listener:/app/listener-data
      - ./accounts:/app/accounts:ro
      # - ./accounts.json:/app/accounts.json:ro
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot QR. Not started by `docker compose up`.
  # docker compose run --rm -e WHATSAPP_PAIR_CONFIRM=1 pair <account>
  pair:
    profiles: ["pair"]
    image: *bridge-image
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    network_mode: "service:bridge"
    depends_on:
      bridge:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: ["pair"]
    environment:
      <<: *app-env
      WHATSAPP_DOCKER_ROLE: pair
    volumes:
      - wa-session:/app/session
      - wa-sessions:/app/sessions
      - ./accounts:/app/accounts:ro
      # - ./accounts.json:/app/accounts.json:ro
    healthcheck:
      disable: true

volumes:
  wa-session:
  wa-sessions:
  wa-listener:
